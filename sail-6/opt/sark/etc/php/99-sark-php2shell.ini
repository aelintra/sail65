; SAIL defense-in-depth for PHP2Shell (CVE-2026-109618 / CVE-2026-109619).
; Disabling session upload progress reduces one CVE-2026-109619 attack path.
; This is NOT a substitute for installing the vendor-patched PHP packages
; (Ubuntu 24.04: libapache2-mod-php8.3 >= 8.3.6-0ubuntu0.24.04.13) and
; restarting Apache so every mod_php worker loads the new binary.
session.upload_progress.enabled = Off
