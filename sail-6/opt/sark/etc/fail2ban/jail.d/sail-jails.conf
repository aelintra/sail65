# SAIL core jails — Ubuntu 24.04 LTS
# Install: ln -sf /opt/sark/etc/fail2ban/jail.d/sail-jails.conf /etc/fail2ban/jail.d/sail-jails.conf
#
# Use jail.d fragments only (do not symlink a full jail.local — breaks %(auth_log)s
# interpolation on fail2ban 1.x and fights Debian backend=systemd).
# setip.php updates ignoreip in this file.

[DEFAULT]
banaction = shorewall
# Override Debian defaults-debian.conf (backend=systemd) so Asterisk file logs are watched.
backend = auto
ignoreip = 127.0.0.1/8 ::1 224.0.1.0/24

[sshd]
enabled   = true
filter    = sshd
logpath   = /var/log/auth.log
maxretry  = 3
findtime  = 600
bantime   = 86400

# SAIL routes SecurityEvents into messages (logger.conf). Distro asterisk filter
# matches both classic NOTICE lines and SecurityEvent=FailedAuth|… forms.
[asterisk]
enabled   = true
filter    = asterisk
backend   = auto
logpath   = /var/log/asterisk/messages
maxretry  = 5
findtime  = 600
bantime   = 600

[recidive]
enabled   = true
filter    = recidive
logpath   = /var/log/fail2ban.log
bantime   = 604800
findtime  = 86400
maxretry  = 3
