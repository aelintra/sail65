# SAIL Apache — bad User-Agents / scanners on the management UI.
# Uses system filter apache-badbots (Ubuntu 24.04 ships this).
# Install: ln -sf /opt/sark/etc/fail2ban/jail.d/sail-apache.conf /etc/fail2ban/jail.d/sail-apache.conf

[sail-apache-badbots]
enabled   = true
filter    = apache-badbots
logpath   = /var/log/apache2/access.log
            /var/log/apache2/other_vhosts_access.log
backend   = auto
maxretry  = 1
findtime  = 86400
bantime   = 86400
