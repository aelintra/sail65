[general]

enabled=yes
bindaddr=0.0.0.0
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
# Defaults to snakeoil so :8089/WSS can bind on fresh installs.
# apply-active-cert.sh rewrites these to custom or Let's Encrypt paths.
tlscertfile=/etc/ssl/certs/ssl-cert-snakeoil.pem
tlsprivatekey=/etc/ssl/private/ssl-cert-snakeoil.key
